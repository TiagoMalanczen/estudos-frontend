<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estruturas, listas, tabelas, formularios</title>
</head>
<body>
   
    <header>
         <!--Cabeçalho principal da pagina-->
        <nav>
            <ul>
                <il><a href="#A">A</a></il>
                <il><a href="#B">B</a></il>
            </ul>
        </nav>
    </header>

    <!--Conteúdo principal da página-->
    <main>
        <!--Seção sobre a área A-->
        <section>
            <h2 id="A">Aba A</h2>
            <p>Tudo sobre a aba A</p>
        </section>

        <!--Seção sobre a área B-->
        <section>
            <h2 id="B">Aba B</h2>

            <!--Artigo individual -->
            <article>
                <h3>B.1</h3>
                <p>Conteúdo sobre b.1</p>
            </article>
        </section>

        <section>
            <h2>Aba C</h2>
            <!--Usado para incorporar conteudos externos-->
            <iframe 
                src="https://google.com" 
                width="600" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </section>
    </main>
    <!--Barra lateral com conteúdos complementares-->
    <aside>
        <h2>Tudo sobre a página</h2>
            <ul>
                <li>1</li>
                <li>2</li>
            </ul>
    </aside>
    
    <footer><p>Rodapé da página</p></footer>
</body>
</html>
